[project]
name = "pyfplib"
description = "A functional programming library for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "comet11x", email = "comet11x@protonmail.com" }]
keywords = [
  "algorithm",
  "fp",
  "function-library",
  "functional-programming",
  "monad",
  "option",
  "option-monad",
  "result",
  "result-monad",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

dependencies = []

[project.urls]
Documentation = "https://github.com/Comet11x/pyfplib/blob/main/README.md"
Issues = "https://github.com/Comet11x/pyfplib/issues"
Source = "https://github.com/Comet11x/pyfplib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.coverage.run]
source_pkgs = ["pyfplib", "tests"]
branch = true
parallel = true
omit = ["src/pyfplib/__about__.py"]

[tool.coverage.paths]
pyfplib = ["src/pyfplib", "*/pyfplib/src/pyfplib"]
tests = ["tests", "*/pyfplib/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

# [project.scripts]
# run_pyfplib = "pyfplib:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfplib"]

[tool.hatch.version]
path = "src/pyfplib/__about__.py"

[tool.hatch.envs.test]
dependencies = ["pytest"]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
test = "pytest {args}"

[tool.hatch.envs.default]
dependencies = [
  "ruff",
  "black",
  "mypy",
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-cov"
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
test-pytest-cov = "pytest --cov=core --cov-branch --cov-report=term-missing {args:tests/}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.lint]
detached = true
dependencies = ["black>=24.8.0", "mypy>=1.0.0", "ruff>=0.6.8"]

[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:pyfplib tests}"
style = ["ruff {args:.}", "black --check --diff {args:.}"]
fmt = ["black {args:.}", "ruff --fix {args:.}", "style"]
all = ["style", "typing"]

[tool.ruff]
target-version = "py312"  # Or higher, like "py311"; supports "py37" through "py313"
line-length = 120

[tool.test]
pythonpath = "src"
testpaths = ["tests"]
addopts = "-v --strict-markers"
python_classes = "Test* *Test"
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
log_cli = true
markers = "core"
filterwarnings = ["ignore::DeprecationWarning"]
